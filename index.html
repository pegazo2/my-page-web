<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flashcards Interactivas</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f9fc;
      margin: 0; padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: flex-start;
    }
    header {
      background: #007bff;
      width: 100%;
      color: white;
      padding: 1rem;
      text-align: center;
      font-weight: bold;
      font-size: 1.5rem;
    }
    main {
      background: white;
      max-width: 600px;
      width: 100%;
      margin: 2rem;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .flashcard {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      font-weight: 600;
      text-align: center;
    }
    .phonetic {
      font-style: italic;
      color: #555;
      margin-bottom: 1rem;
      text-align: center;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      font-size: 1.2rem;
      border: 2px solid #ddd;
      border-radius: 6px;
      margin-bottom: 1rem;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      border: none;
      color: white;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 0.5rem;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    .btn-group {
      margin-bottom: 1rem;
      text-align: center;
    }
    .message {
      font-weight: 700;
      text-align: center;
      margin-bottom: 1rem;
    }
    .correct {
      color: green;
    }
    .incorrect {
      color: red;
    }
    .saved-list {
      margin-top: 2rem;
      font-size: 1rem;
    }
    .saved-list h3 {
      margin-bottom: 0.5rem;
    }
    .saved-list ul {
      list-style: none;
      padding-left: 0;
    }
    .saved-list li {
      padding: 0.3rem 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <header>Flashcards Interactivas - Inglés Americano (USA)</header>
  <main>
    <div class="flashcard" id="flashcard"></div>
    <div class="phonetic" id="phonetic"></div>

    <input type="text" id="answerInput" placeholder="Escribe la traducción aquí..." autocomplete="off" />

    <div class="btn-group">
      <button id="checkBtn">Verificar</button>
      <button id="nextBtn">Siguiente</button>
    </div>

    <div class="btn-group">
      <button id="playNormal">▶️ Reproducir Normal</button>
      <button id="playSlow">🐢 Reproducir Lento</button>
      <button id="playFast">🐇 Reproducir Rápido</button>
    </div>

    <div class="message" id="message"></div>

    <div class="saved-list">
      <h3>Flashcards guardadas para repasar:</h3>
      <ul id="savedCards"></ul>
    </div>
  </main>

  <script>
    // Tus flashcards
    const flashcards = [
      { en: "Where do you want to go?", es: "¿A dónde quieres ir?", phonetic: "wɛr du ju wɑnt tu ɡoʊ" },
      { en: "How do you say this in English?", es: "¿Cómo se dice esto en inglés?", phonetic: "haʊ du ju seɪ ðɪs ɪn ˈɪŋɡlɪʃ" },
      // ... el resto igual
      { en: "Can you come here?", es: "¿Puedes venir aquí?", phonetic: "kæn ju kʌm hɪər" }
    ];

    let currentIndex = 0;
    const flashcardDiv = document.getElementById('flashcard');
    const phoneticDiv = document.getElementById('phonetic');
    const answerInput = document.getElementById('answerInput');
    const checkBtn = document.getElementById('checkBtn');
    const nextBtn = document.getElementById('nextBtn');
    const messageDiv = document.getElementById('message');
    const savedCardsList = document.getElementById('savedCards');

    let savedCards = JSON.parse(localStorage.getItem('savedFlashcards')) || [];

    function saveToLocalStorage() {
      localStorage.setItem('savedFlashcards', JSON.stringify(savedCards));
    }

    function updateSavedList() {
      savedCardsList.innerHTML = "";
      if (savedCards.length === 0) {
        savedCardsList.innerHTML = "<li>No hay flashcards guardadas aún.</li>";
        return;
      }
      savedCards.forEach(card => {
        const li = document.createElement('li');
        li.textContent = `${card.en} — ${card.es}`;
        savedCardsList.appendChild(li);
      });
    }

    function showFlashcard() {
      const card = flashcards[currentIndex];
      flashcardDiv.textContent = card.en;
      phoneticDiv.textContent = `/ ${card.phonetic} /`;
      answerInput.value = "";
      messageDiv.textContent = "";
      messageDiv.className = "message";  // resetear clase mensaje
      answerInput.focus();
    }

    function speak(text, rate=1) {
      if (!window.speechSynthesis) return alert("Este navegador no soporta síntesis de voz.");
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = rate;
      window.speechSynthesis.speak(utterance);
    }

    checkBtn.onclick = () => {
      const card = flashcards[currentIndex];
      let userAnswer = answerInput.value.trim().toLowerCase();
      let correctAnswer = card.es.toLowerCase();

      if(userAnswer === "") {
        messageDiv.textContent = `La traducción es: "${card.es}"`;
        messageDiv.className = "message correct";
        return;
      }

      if(userAnswer === correctAnswer) {
        messageDiv.textContent = "¡Correcto! 🎉";
        messageDiv.className = "message correct";
        if(!savedCards.find(c => c.en === card.en)) {
          savedCards.push(card);
          saveToLocalStorage();
          updateSavedList();
        }
      } else {
        messageDiv.textContent = `Incorrecto. La respuesta correcta es: "${card.es}"`;
        messageDiv.className = "message incorrect";
      }
    };

    nextBtn.onclick = () => {
      currentIndex = (currentIndex + 1) % flashcards.length;
      showFlashcard();
    };

    document.getElementById('playNormal').onclick = () => speak(flashcards[currentIndex].en, 1);
    document.getElementById('playSlow').onclick = () => speak(flashcards[currentIndex].en, 0.6);
    document.getElementById('playFast').onclick = () => speak(flashcards[currentIndex].en, 1.5);

    // Mostrar la primera flashcard y lista guardada
    showFlashcard();
    updateSavedList();
  </script>
</body>
</html>
